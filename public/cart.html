<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Kisan Direct</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      align-items: start;
    }
    .cart-item-row {
      display: grid;
      grid-template-columns: 80px 1fr auto auto auto;
      gap: 1.25rem;
      align-items: center;
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      background: #fff;
    }
    .cart-item-row:last-child {
      border-bottom: none;
    }
    .cart-thumb {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      object-fit: cover;
    }
    .cart-qty-box {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .cart-qty-btn {
      width: 32px;
      height: 32px;
      background: #f8fafc;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .cart-qty-val {
      width: 40px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
      .cart-item-row {
        grid-template-columns: 60px 1fr;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">
      
      <div class="mb-3">
        <h2>Your Shopping Cart</h2>
        <p style="color: var(--text-muted);">Review selected grains and proceed to direct farm checkout.</p>
      </div>

      <div id="cart-container">
        <!-- Rendered via JS -->
        <div class="card text-center" style="padding: 3rem;">
          <p>Loading your cart...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
  <script>
    let cartData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await renderNavbar();
      const user = await checkAuth();

      if (!user) {
        showToast('Please log in to view your cart.', 'info');
        setTimeout(() => window.location.href = 'login.html?redirect=cart.html', 1000);
        return;
      }

      if (user.role !== 'customer') {
        showToast('Only customers have a shopping cart.', 'error');
        setTimeout(() => window.location.href = 'farmer-dashboard.html', 1000);
        return;
      }

      loadCart();
    });

    async function loadCart() {
      const container = document.getElementById('cart-container');
      const res = await apiFetch('/api/customers/cart');

      if (res.success && res.cart) {
        cartData = res.cart;

        if (!res.cart.items || res.cart.items.length === 0) {
          container.innerHTML = `
            <div class="card text-center" style="padding: 4rem 1.5rem;">
              <span style="font-size: 3.5rem;">🌾</span>
              <h3 class="mt-2">Your Cart is Currently Empty</h3>
              <p style="color: var(--text-muted); max-width: 450px; margin: 0.5rem auto 1.5rem auto;">
                Support local farmers by purchasing unpolished grains, pulses, and flours directly from our farm catalogue.
              </p>
              <a href="products.html" class="btn btn-primary">Browse Fresh Grains</a>
            </div>
          `;
          updateCartCount();
          return;
        }

        container.innerHTML = `
          <div class="cart-layout">
            <!-- Items Column -->
            <div class="card" style="padding: 0; overflow: hidden;">
              <div style="padding: 1rem 1.25rem; background: #f8fafc; border-bottom: 1px solid var(--border-color); font-weight: 700; color: #475569;">
                Cart Items (${res.cart.items.length})
              </div>

              ${res.cart.items.map(item => `
                <div class="cart-item-row">
                  <img src="${item.product.image || 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=600'}" alt="${item.product.name}" class="cart-thumb" onerror="this.src='https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=600'">
                  
                  <div>
                    <span class="badge badge-grain" style="font-size:0.7rem; margin-bottom: 0.25rem;">${item.product.category}</span>
                    <h4 style="font-size: 1rem; margin-bottom: 0.2rem;">
                      <a href="product-details.html?id=${item.product.id}">${item.product.name}</a>
                    </h4>
                    <div style="font-size: 0.82rem; color: var(--text-muted);">
                      📍 ${item.product.farmer ? item.product.farmer.location : 'Farm Origin'} • 👤 ${item.product.farmer ? item.product.farmer.name : 'Farmer'}
                    </div>
                    <div style="font-size: 0.88rem; font-weight: 600; color: var(--primary-dark); margin-top: 0.3rem;">
                      ₹${item.product.pricePerKg} / kg
                    </div>
                  </div>

                  <!-- Quantity -->
                  <div class="cart-qty-box">
                    <button class="cart-qty-btn" onclick="updateItemQty('${item.product.id}', ${item.quantityKg - 1})">-</button>
                    <span class="cart-qty-val">${item.quantityKg} kg</span>
                    <button class="cart-qty-btn" onclick="updateItemQty('${item.product.id}', ${item.quantityKg + 1})">+</button>
                  </div>

                  <!-- Subtotal -->
                  <div style="text-align: right; font-weight: 800; color: var(--primary-dark); font-size: 1.05rem;">
                    ₹${item.subtotal}
                  </div>

                  <!-- Remove Button -->
                  <div>
                    <button onclick="removeItem('${item.product.id}')" class="btn btn-sm btn-outline" style="border-color: #fca5a5; color: #dc2626; padding: 4px 8px;" title="Remove from cart">
                      🗑️
                    </button>
                  </div>
                </div>
              `).join('')}

              <div style="padding: 1rem 1.25rem; background: #fafafa; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <button onclick="clearEntireCart()" class="btn btn-sm btn-outline" style="border-color: #cbd5e1; color: #64748b;">
                  Clear Cart
                </button>
                <a href="products.html" style="font-size: 0.9rem; font-weight: 600;">+ Add More Grains</a>
              </div>
            </div>

            <!-- Order Summary Column -->
            <div class="card" style="padding: 1.75rem;">
              <h3 style="margin-bottom: 1.25rem; font-size: 1.2rem;">Order Summary</h3>
              
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.95rem;">
                <span style="color: var(--text-muted);">Total Quantity:</span>
                <span style="font-weight: 700;">${res.cart.totalItems} kg</span>
              </div>

              <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.95rem;">
                <span style="color: var(--text-muted);">Grains Subtotal:</span>
                <span style="font-weight: 700;">₹${res.cart.subtotal}</span>
              </div>

              <div style="display: flex; justify-content: space-between; margin-bottom: 1.25rem; font-size: 0.95rem;">
                <span style="color: var(--text-muted);">Direct Delivery:</span>
                <span style="font-weight: 700; color: var(--primary);">FREE PROMO</span>
              </div>

              <hr style="border: none; border-top: 1px dashed var(--border-color); margin-bottom: 1.25rem;">

              <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.2rem;">
                <span style="font-weight: 800; color: var(--primary-dark);">Grand Total:</span>
                <span style="font-weight: 800; color: var(--primary-dark);">₹${res.cart.totalAmount}</span>
              </div>

              <a href="checkout.html" class="btn btn-lg btn-primary btn-block">
                Proceed to Checkout →
              </a>

              <div style="margin-top: 1rem; font-size: 0.78rem; color: var(--text-muted); text-align: center;">
                🔒 100% Secure Direct Farm Purchase<br>Cash on Delivery Available
              </div>
            </div>
          </div>
        `;
        updateCartCount();
      }
    }

    async function updateItemQty(productId, newQty) {
      if (newQty <= 0) {
        removeItem(productId);
        return;
      }

      const res = await apiFetch(`/api/customers/cart/${productId}`, {
        method: 'PUT',
        body: { quantityKg: newQty }
      });

      if (res.success) {
        loadCart();
      } else {
        showToast(res.message || 'Could not update quantity.', 'error');
      }
    }

    async function removeItem(productId) {
      const res = await apiFetch(`/api/customers/cart/${productId}`, {
        method: 'DELETE'
      });

      if (res.success) {
        showToast('Item removed from cart.', 'info');
        loadCart();
      } else {
        showToast(res.message || 'Failed to remove item.', 'error');
      }
    }

    async function clearEntireCart() {
      if (!confirm('Are you sure you want to clear your cart?')) return;

      const res = await apiFetch('/api/customers/cart', {
        method: 'DELETE'
      });

      if (res.success) {
        showToast('Cart cleared.', 'info');
        loadCart();
      }
    }
  </script>
</body>
</html>
