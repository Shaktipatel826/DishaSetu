<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Kisan Direct Marketplace</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content flex-center">
    <div class="container" style="max-width: 540px;">
      
      <div class="card" style="padding: 2.25rem;">
        <div class="text-center mb-3">
          <span style="font-size: 2.5rem;">🌾</span>
          <h2 class="mt-1">Create Your Account</h2>
          <p style="font-size: 0.92rem; color: var(--text-muted);">
            Join the direct grain revolution today.
          </p>
        </div>

        <form id="register-form">
          <!-- Role Selector -->
          <div class="form-group">
            <label class="form-label" for="role-select">Select Your Role</label>
            <select id="role-select" class="form-select" onchange="toggleRoleFields()" required>
              <option value="customer">🛒 Customer (Buy Direct Grains)</option>
              <option value="farmer">🌱 Farmer (Sell Harvested Crops)</option>
            </select>
          </div>

          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="name" id="name-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Ramesh Patel" required>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label class="form-label" for="phone">Phone / Mobile Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
          </div>

          <!-- Dynamic Field: Location for Farmer -->
          <div class="form-group" id="farmer-location-group" style="display: none;">
            <label class="form-label" for="location">Farm / Village Location</label>
            <input type="text" id="location" class="form-control" placeholder="e.g. Sehore, Madhya Pradesh">
            <div class="input-help">Where your crops are cultivated and packed.</div>
          </div>

          <!-- Dynamic Field: Address for Customer -->
          <div class="form-group" id="customer-address-group">
            <label class="form-label" for="address">Delivery Address</label>
            <textarea id="address" class="form-control" placeholder="Flat No, Building, Street, City, State, PIN Code" rows="2"></textarea>
            <div class="input-help">Where grains will be delivered.</div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Create a secure password" required minlength="6">
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Re-type password" required minlength="6">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block mt-2">
            Create Account
          </button>
        </form>

        <div class="text-center mt-3" style="font-size: 0.9rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderNavbar();

      // Check URL parameters for preset role
      const params = new URLSearchParams(window.location.search);
      const presetRole = params.get('role');
      if (presetRole === 'farmer') {
        document.getElementById('role-select').value = 'farmer';
      }
      toggleRoleFields();
    });

    function toggleRoleFields() {
      const role = document.getElementById('role-select').value;
      const farmerLoc = document.getElementById('farmer-location-group');
      const custAddr = document.getElementById('customer-address-group');
      const nameLabel = document.getElementById('name-label');

      if (role === 'farmer') {
        farmerLoc.style.display = 'block';
        custAddr.style.display = 'none';
        document.getElementById('location').required = true;
        document.getElementById('address').required = false;
        nameLabel.textContent = 'Farmer Full Name';
      } else {
        farmerLoc.style.display = 'none';
        custAddr.style.display = 'block';
        document.getElementById('location').required = false;
        document.getElementById('address').required = true;
        nameLabel.textContent = 'Customer Full Name';
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const role = document.getElementById('role-select').value;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const submitBtn = document.getElementById('submit-btn');

      if (password !== confirmPassword) {
        showToast('Passwords do not match. Please verify.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      let endpoint = '/api/auth/register-customer';
      let payload = { name, email, phone, password };

      if (role === 'farmer') {
        endpoint = '/api/auth/register-farmer';
        payload.location = document.getElementById('location').value.trim();
      } else {
        payload.address = document.getElementById('address').value.trim();
      }

      const res = await apiFetch(endpoint, {
        method: 'POST',
        body: payload
      });

      if (res.success) {
        showToast(res.message || 'Registration successful!', 'success');
        if (res.user) {
          localStorage.setItem('kisan_user', JSON.stringify(res.user));
        }

        setTimeout(() => {
          if (role === 'farmer') {
            window.location.href = 'farmer-dashboard.html';
          } else {
            window.location.href = 'customer-dashboard.html';
          }
        }, 1000);
      } else {
        showToast(res.message || 'Registration failed.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
