<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Kisan Direct</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .product-detail-layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
      align-items: start;
    }
    .detail-img-box {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      background: #fff;
    }
    .detail-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
    }
    .farmer-info-card {
      background: #f4faf6;
      border: 1px solid #ccebd7;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      max-width: 160px;
    }
    .qty-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .qty-btn:hover {
      background: var(--bg-muted);
      border-color: var(--primary);
    }
    .qty-input {
      width: 60px;
      height: 38px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }
    .review-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) {
      .product-detail-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">
      
      <!-- Back button -->
      <div class="mb-2">
        <a href="products.html" style="font-weight: 600; font-size: 0.9rem;">← Back to All Grains</a>
      </div>

      <div id="detail-container">
        <!-- Rendered via JS -->
        <div class="card text-center" style="padding: 3rem;">
          <p>Loading product details...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
  <script>
    let currentProduct = null;
    let selectedQty = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      await renderNavbar('products');

      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      if (!productId) {
        window.location.href = 'products.html';
        return;
      }

      fetchProductDetails(productId);
    });

    async function fetchProductDetails(id) {
      const container = document.getElementById('detail-container');
      const res = await apiFetch(`/api/products/${id}`);

      if (res.success && res.product) {
        currentProduct = res.product;
        const p = res.product;
        const reviews = res.reviews || [];

        container.innerHTML = `
          <div class="product-detail-layout">
            <!-- Product Image -->
            <div class="detail-img-box">
              <img src="${p.image || 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=600'}" alt="${p.name}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=600'">
            </div>

            <!-- Product Specs & Actions -->
            <div class="card" style="padding: 2rem;">
              <div class="flex-between mb-1">
                <span class="badge badge-grain">${p.category}</span>
                <span class="rating-stars" style="font-size: 1rem;">
                  ★ ${p.ratingAvg > 0 ? p.ratingAvg : 'New'} 
                  <span style="font-size: 0.85rem; color: #64748b;">(${p.ratingCount} reviews)</span>
                </span>
              </div>

              <h1 style="font-size: 1.85rem; margin-bottom: 0.75rem;">${p.name}</h1>

              <div class="flex items-center gap-2 mb-2">
                <div style="font-size: 1.75rem; font-weight: 800; color: var(--primary-dark);">
                  ₹${p.pricePerKg} <span style="font-size: 1rem; color: var(--text-muted); font-weight: 500;">/ kg</span>
                </div>
                <div>
                  ${p.stockKg > 0 ? `<span class="badge badge-delivered">In Stock (${p.stockKg} kg)</span>` : `<span class="badge badge-rejected">Out of Stock</span>`}
                </div>
              </div>

              <!-- Farmer Identity Card -->
              <div class="farmer-info-card">
                <div style="font-size: 2rem;">🧑‍🌾</div>
                <div>
                  <div style="font-weight: 700; color: var(--primary-dark); font-size: 1rem;">
                    Cultivated by ${p.farmer ? p.farmer.name : 'Verified Farmer'}
                  </div>
                  <div style="font-size: 0.85rem; color: #4b5563;">
                    📍 Farm Location: <strong>${p.farmer ? p.farmer.location : 'Direct Farm'}</strong>
                  </div>
                  <div style="font-size: 0.78rem; color: var(--primary); font-weight: 600; margin-top: 2px;">
                    ✓ Verified Direct Producer (100% Direct Payout)
                  </div>
                </div>
              </div>

              <!-- Description -->
              <div class="mb-3">
                <h4 style="margin-bottom: 0.4rem;">Grain Description & Origin:</h4>
                <p style="color: #4b5563; font-size: 0.95rem; line-height: 1.6;">
                  ${p.description || 'Natural, single-origin grains harvested directly from fertile Indian agricultural fields. Free from chemical polishing, synthetic dyes, and long intermediary storage.'}
                </p>
              </div>

              <!-- Quantity & Purchase Options -->
              ${p.stockKg > 0 ? `
                <div class="mb-3">
                  <label class="form-label">Select Quantity (in kg):</label>
                  <div class="flex items-center gap-3">
                    <div class="qty-control">
                      <button type="button" class="qty-btn" onclick="adjustQty(-1)">-</button>
                      <input type="number" id="qty-input" class="qty-input" value="1" min="1" max="${p.stockKg}" onchange="validateQty()">
                      <button type="button" class="qty-btn" onclick="adjustQty(1)">+</button>
                    </div>
                    <div id="subtotal-calc" style="font-weight: 700; color: var(--primary); font-size: 1.1rem;">
                      Total: ₹${p.pricePerKg}
                    </div>
                  </div>
                </div>

                <div class="flex gap-2">
                  <button onclick="addToCartCurrent(false)" class="btn btn-lg btn-outline" style="flex: 1;">
                    🛒 Add to Cart
                  </button>
                  <button onclick="addToCartCurrent(true)" class="btn btn-lg btn-primary" style="flex: 1;">
                    ⚡ Buy Now
                  </button>
                </div>
              ` : `
                <button class="btn btn-lg btn-secondary btn-block" disabled>Currently Out of Stock</button>
              `}
            </div>
          </div>

          <!-- Customer Ratings & Feedback Section -->
          <div class="card mt-4" style="padding: 2rem;">
            <div class="flex-between mb-3">
              <div>
                <h3>Customer Reviews & Ratings</h3>
                <p style="margin: 0; color: var(--text-muted);">Verified reviews from buyers of this grain harvest.</p>
              </div>
              <div class="rating-stars" style="font-size: 1.25rem;">
                ★ ${p.ratingAvg > 0 ? p.ratingAvg : '0.0'} / 5.0
              </div>
            </div>

            <div id="reviews-list">
              ${reviews.length > 0 ? reviews.map(r => `
                <div class="review-card">
                  <div class="flex-between mb-1">
                    <div style="font-weight: 700; color: var(--text-main);">
                      👤 ${r.customer ? r.customer.name : 'Verified Customer'}
                    </div>
                    <span class="rating-stars">★ ${r.rating} / 5</span>
                  </div>
                  <p style="margin-bottom: 0.4rem; color: #374151; font-size: 0.95rem;">"${r.comment}"</p>
                  <div style="font-size: 0.78rem; color: var(--text-muted);">${formatDate(r.createdAt)}</div>
                </div>
              `).join('') : `
                <p style="color: var(--text-muted); font-style: italic;">No reviews yet for this harvest. Be the first to order and share feedback!</p>
              `}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="card text-center" style="padding: 3rem;">
            <h3>Product Not Found</h3>
            <p>The grain listing you are looking for does not exist or has been removed.</p>
            <a href="products.html" class="btn btn-primary btn-sm">Browse Other Grains</a>
          </div>
        `;
      }
    }

    function adjustQty(delta) {
      if (!currentProduct) return;
      const input = document.getElementById('qty-input');
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      if (val > currentProduct.stockKg) val = currentProduct.stockKg;
      input.value = val;
      selectedQty = val;
      updateSubtotalDisplay();
    }

    function validateQty() {
      if (!currentProduct) return;
      const input = document.getElementById('qty-input');
      let val = parseInt(input.value) || 1;
      if (val < 1) val = 1;
      if (val > currentProduct.stockKg) val = currentProduct.stockKg;
      input.value = val;
      selectedQty = val;
      updateSubtotalDisplay();
    }

    function updateSubtotalDisplay() {
      const el = document.getElementById('subtotal-calc');
      if (el && currentProduct) {
        const total = currentProduct.pricePerKg * selectedQty;
        el.textContent = `Total: ₹${total.toLocaleString('en-IN')}`;
      }
    }

    async function addToCartCurrent(proceedToCheckout = false) {
      if (!currentProduct) return;

      const user = getStoredUser();
      if (!user) {
        showToast('Please login to place orders.', 'info');
        setTimeout(() => window.location.href = 'login.html', 1000);
        return;
      }

      if (user.role !== 'customer') {
        showToast('Only customer accounts can purchase. Please login as a customer.', 'error');
        return;
      }

      const res = await apiFetch('/api/customers/cart', {
        method: 'POST',
        body: {
          productId: currentProduct._id,
          quantityKg: selectedQty
        }
      });

      if (res.success) {
        showToast(res.message || `Added ${selectedQty} kg of ${currentProduct.name} to cart!`, 'success');
        updateCartCount();

        if (proceedToCheckout) {
          setTimeout(() => {
            window.location.href = 'cart.html';
          }, 600);
        }
      } else {
        showToast(res.message || 'Failed to add product to cart.', 'error');
      }
    }
  </script>
</body>
</html>
